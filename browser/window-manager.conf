# Keep the upstream program name because its wrapper starts "mutter" explicitly.
# Fluxbox avoids compositor-driven redraws when x11vnc reads a mostly static screen.
[program:mutter]
command=/bin/bash -lc 'exec fluxbox -display ":${DISPLAY_NUM:-1}"'
autostart=false
autorestart=true
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisord/mutter
redirect_stderr=true
